# Local development stack: the gateway, the three upstreams it proxies to,
# the two data stores, and the observability pair that watches all of it.

services:
  redis:
    image: redis:7-alpine
    container_name: gateway-redis
    ports:
      - "6379:6379"
    # appendonly keeps rate limit counters across a container restart, which
    # makes local testing behave more like a real deployment.
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: gateway-postgres
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 10s
      timeout: 3s
      retries: 5

  service-a:
    build:
      context: .
      dockerfile: docker/Dockerfile.upstream
    container_name: gateway-service-a
    environment:
      SERVICE_MODULE: upstream.service_a.main:app
      SERVICE_PORT: 8001
    ports:
      - "8001:8001"

  service-b:
    build:
      context: .
      dockerfile: docker/Dockerfile.upstream
    container_name: gateway-service-b
    environment:
      SERVICE_MODULE: upstream.service_b.main:app
      SERVICE_PORT: 8002
    ports:
      - "8002:8002"

  service-c:
    build:
      context: .
      dockerfile: docker/Dockerfile.upstream
    container_name: gateway-service-c
    environment:
      SERVICE_MODULE: upstream.service_c.main:app
      SERVICE_PORT: 8003
    ports:
      - "8003:8003"

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    container_name: gateway
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      ROUTES_FILE: routes.yaml
      # Service names resolve over the compose network, which is why
      # routes.yaml can refer to http://service-a:8001 directly.
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://gateway:gateway@postgres:5432/gateway
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      service-a:
        condition: service_started
      service-b:
        condition: service_started
      service-c:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: gateway-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 15 days is plenty for a local stack and keeps the volume small.
      - --storage.tsdb.retention.time=15d
      # Lets a config change be applied with a POST instead of a restart.
      - --web.enable-lifecycle
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:11.3.1
    container_name: gateway-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Local stack only. Anonymous viewing means the dashboard is one click
      # from a fresh checkout rather than a login prompt.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # The browser console for showing the gateway off. Static files behind
  # nginx, which also proxies /gw to the gateway and /upstream to the mock
  # services, so the browser talks to one origin and needs no CORS.
  console:
    build:
      context: ./frontend
    container_name: gateway-console
    ports:
      - "8080:80"
    depends_on:
      - gateway
      - service-a
      - service-b
      - service-c

volumes:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:
