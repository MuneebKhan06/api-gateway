# Prometheus scrape configuration for the local stack.

global:
  # 15s is the usual default and it suits a gateway: fine enough to catch a
  # breaker opening and closing, coarse enough not to be a load source itself.
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8000"]
        labels:
          service: api-gateway

  # Prometheus watching itself, so a stuck scrape loop is visible.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
