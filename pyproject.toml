[project]
name = "api-gateway"
version = "0.1.0"
description = "API gateway with JWT auth, Redis rate limiting, circuit breaking and Prometheus metrics"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
